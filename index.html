<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Mofie — Pure, Fast, Convenient</title>
  <meta name="description" content="Mofie — fast, private messaging with disappearing messages, status, and crystal-clear replies.">

  <!-- ── PWA / Theme ─────────────────────────────────────────── -->
  <meta name="theme-color" content="#111B21" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#008069" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mofie">
  <meta name="application-name" content="Mofie">
  <meta name="format-detection" content="telephone=no">

  <!-- ── Preconnects ─────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://api.cloudinary.com" crossorigin>
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

  <!-- ── Fonts ───────────────────────────────────────────────── -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- ── Icons / Manifest ────────────────────────────────────── -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/rirfqxoz/image/upload/IMG-20261022-WA0000.jpg">
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/rirfqxoz/image/upload/IMG-20261022-WA0000.jpg">

  <!-- ── App CSS ─────────────────────────────────────────────── -->
  <link rel="stylesheet" href="style.css">

  <!-- ── Boot styles — solid, crisp, no blur ─────────────────── -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0B141A;
      color: #E9EDEF;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    /* ═══ Boot splash — solid, premium, no glow ═══ */
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0B141A;
      z-index: 9999;
      transition: opacity .4s cubic-bezier(.16, 1, .3, 1);
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash .boot-logo {
      width: 72px; height: 72px;
      fill: #0088CC;
      animation: boot-flap .8s infinite alternate ease-in-out;
    }
    #boot-splash .boot-text {
      font-size: 40px; font-weight: 900;
      letter-spacing: 2px;
      color: #0088CC;
      margin: 0;
    }
    #boot-splash .boot-spinner {
      width: 36px; height: 36px;
      border: 3px solid #2A3942;
      border-top-color: #0088CC;
      border-radius: 50%;
      animation: boot-spin .8s linear infinite;
      margin-top: 12px;
    }
    #boot-splash .boot-caption {
      font-size: 13px;
      color: #8696A0;
      margin-top: 4px;
      font-weight: 500;
    }
    @keyframes boot-flap {
      0%   { transform: scaleX(1); }
      100% { transform: scaleX(.4) rotate(5deg); }
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }

    /* ═══ Fatal error — clean, legible ═══ */
    #fatal-error {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #0B141A;
      color: #E9EDEF;
      padding: 24px;
      font-family: Inter, monospace;
      overflow-y: auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #fatal-error.show { display: flex; }
    #fatal-error h2 {
      color: #ef4444;
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 800;
    }
    #fatal-error p {
      color: #AEBAC1;
      font-size: 14px;
      line-height: 1.6;
      max-width: 500px;
      margin: 0 0 8px;
      word-break: break-word;
    }
    #fatal-error pre {
      background: #111B21;
      border: 1px solid #2A3942;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      color: #8696A0;
      max-width: 500px;
      width: 100%;
      overflow-x: auto;
      text-align: left;
      margin: 12px 0 20px;
    }
    #fatal-error button {
      padding: 12px 28px;
      border-radius: 24px;
      border: none;
      background: #0088CC;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: filter .2s;
    }
    #fatal-error button:hover { filter: brightness(1.1); }

    body[data-app-ready="1"] #boot-splash { opacity: 0; pointer-events: none; }
  </style>
</head>

<body>
  <!-- ── Boot splash ─────────────────────────────────────────── -->
  <div id="boot-splash" aria-hidden="true">
    <svg class="boot-logo" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
    </svg>
    <h1 class="boot-text">Mofie</h1>
    <div class="boot-spinner" aria-hidden="true"></div>
    <div class="boot-caption">Loading…</div>
  </div>

  <!-- ── App root ────────────────────────────────────────────── -->
  <div id="app" role="application" aria-label="Mofie messaging app"></div>

  <!-- ── Fatal error overlay ─────────────────────────────────── -->
  <div id="fatal-error" role="alert" aria-live="assertive">
    <h2>⚠️ App Error</h2>
    <p id="fatal-error-msg">Something went wrong.</p>
    <pre id="fatal-error-detail"></pre>
    <button onclick="location.reload()">Reload App</button>
  </div>

  <!-- ── Global error boundaries ─────────────────────────────── -->
  <script>
    (function () {
      window.__mofieMarkReady = function () {
        document.body.setAttribute('data-app-ready', '1');
        const splash = document.getElementById('boot-splash');
        if (splash) setTimeout(() => splash.remove(), 450);
      };

      const observer = new MutationObserver(function () {
        const appEl = document.getElementById('app');
        if (appEl && appEl.children.length > 0) {
          window.__mofieMarkReady();
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('app'), { childList: true });

      setTimeout(function () {
        const splash = document.getElementById('boot-splash');
        if (splash && document.getElementById('app').children.length === 0) {
          const cap = splash.querySelector('.boot-caption');
          if (cap) cap.textContent = 'Still loading… check your connection.';
        }
      }, 10000);

      window.__mofieFatal = function (msg, detail) {
        const box = document.getElementById('fatal-error');
        document.getElementById('fatal-error-msg').textContent = msg || 'Unknown error';
        const pre = document.getElementById('fatal-error-detail');
        if (detail) { pre.textContent = detail; pre.style.display = 'block'; }
        else { pre.style.display = 'none'; }
        box.classList.add('show');
      };

      window.addEventListener('error', function (e) {
        console.error('[window.error]', e.error || e.message);
        if (!document.body.hasAttribute('data-app-ready')) {
          window.__mofieFatal(
            'Failed to start the app.',
            (e.error && e.error.stack) || e.message || 'Unknown script error'
          );
        }
      });

      window.addEventListener('unhandledrejection', function (e) {
        console.error('[unhandledrejection]', e.reason);
      });

      window.addEventListener('offline', () => {
        const b = document.createElement('div');
        b.id = 'offline-banner';
        b.textContent = '⚠️ You are offline';
        b.style.cssText =
          'position:fixed;bottom:76px;left:50%;transform:translateX(-50%);' +
          'background:#ef4444;color:#fff;padding:8px 18px;border-radius:20px;' +
          'font-size:13px;font-weight:600;z-index:9998;box-shadow:0 6px 20px rgba(0,0,0,.4)';
        document.body.appendChild(b);
      });
      window.addEventListener('online', () => {
        document.getElementById('offline-banner')?.remove();
      });
    })();
  </script>

  <!-- ── App entry ───────────────────────────────────────────── -->
  <script type="module" src="app.js"></script>

  <!-- ── No-JS fallback ──────────────────────────────────────── -->
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
                background:#0B141A;color:#E9EDEF;padding:24px;text-align:center;z-index:10001;
                font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
      <div>
        <h2 style="color:#ef4444;margin:0 0 12px;">JavaScript Required</h2>
        <p style="color:#AEBAC1;font-size:14px;max-width:400px;margin:0 auto;">
          Mofie needs JavaScript to run. Please enable it in your browser settings and reload.
        </p>
      </div>
    </div>
  </noscript>
</body>
</html>
