<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mofie — Pure, Fast, Convenient</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://api.cloudinary.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="preload" href="app.js" as="script" crossorigin>
<link rel="preload" href="style.css" as="style">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111b21">
<link rel="apple-touch-icon" href="https://res.cloudinary.com/rirfqxoz/image/upload/IMG-20261022-WA0000.jpg">
<style>
  #error-box { display:none; position:fixed; top:0; left:0; right:0; background:#ea4335;
    color:#fff; padding:16px; font-family:monospace; font-size:13px; z-index:9999; word-break:break-all; }
</style>
</head>
<body>
<div id="app"></div>
<div id="error-box"></div>
<script>
  window.onerror = function(msg, url, line) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML = `<b>Error:</b> ${msg}<br><b>Line:</b> ${line}`;
  };
</script>
<script type="module" src="app.js"></script>
</body>
</html>
